name: TestSprite API Tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Run TestSprite Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: npm install

      - name: Levantar API
        run: |
          node src/app.js &
          sleep 3
        env:
          PORT: 3000
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Instalar TestSprite CLI
        run: |
          npm install -g @testsprite/testsprite-cli
          echo "$(npm root -g)/.bin" >> $GITHUB_PATH

      - name: Inicializar TestSprite
        run: testsprite init --from-env --yes --agent none
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}

      - name: Ejecutar tests
        run: testsprite test run --wait
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}

      - name: Obtener reporte de fallos (si los hay)
        if: failure()
        run: testsprite test failure get
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}